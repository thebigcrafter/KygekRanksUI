name: Build and validate KygekRanksUI plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate KygekRanksUI plugin
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@v2
    with:
      axolotl-ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
      prepare-dependencies: true
      php-version: '8.4'
      pm-version-major: '5'
      phpstan: max
      phpstan-paths: tools/stubs
      artifact-name: KygekRanksUI-${{ github.sha }}
